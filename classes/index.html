<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clases</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --ink: #18324b; --blue: #1769aa; --cyan: #0f8b8d;
        --line: #d8e3ec; --page: #eef3f6; --paper: #ffffff;
      }
      body {
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        background: var(--page);
        color: var(--ink);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 520px;
        width: 100%;
        background: var(--paper);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(24, 50, 75, 0.13);
        padding: 2.5em 3em;
        text-align: center;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 2.4em;
        color: var(--ink);
        margin: 0 0 0.25em;
      }
      h1::after {
        content: '';
        display: block;
        width: 3.5rem;
        height: 4px;
        margin: 0.6rem auto 1.4rem;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--cyan), #f0b44c);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        margin: 1.2em 0;
      }
      .btn-curso {
        font-size: 1.2em;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
        padding: 0.65em 2em;
        border-radius: 10px;
        background: linear-gradient(135deg, #eaf4fb 0%, #d8eaf5 100%);
        border: 1px solid var(--line);
        transition: background 0.2s, color 0.2s, transform 0.18s, box-shadow 0.18s;
        display: inline-block;
        box-shadow: 0 2px 8px rgba(24, 50, 75, 0.07);
      }
      .btn-curso:hover {
        background: linear-gradient(135deg, var(--blue) 0%, var(--cyan) 100%);
        color: #fff;
        border-color: transparent;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(15, 139, 141, 0.28);
      }
      .back-link {
        display: inline-block;
        margin-top: 2em;
        font-size: 0.95em;
        color: var(--blue);
        text-decoration: none;
        opacity: 0.8;
        transition: opacity 0.2s;
      }
      .back-link:hover { opacity: 1; text-decoration: underline; }
      @media (max-width: 600px) {
        .container { margin: 1em; padding: 1.8em 1.5em; }
        h1 { font-size: 1.8em; }
        .btn-curso { font-size: 1.05em; padding: 0.6em 1.4em; }
      }
    </style>
</head>
<body>
  <div class="container">
    <h1>Clases</h1>
    <ul>
      <li><a class="btn-curso" href="biofisica/index.html">Biofísica</a></li>
      <li><a class="btn-curso" href="calculo/index.html">Cálculo</a></li>
    </ul>
    <a class="back-link" href="../index.html">&#8592; Volver al perfil</a>
  </div>
</body>
</html>
